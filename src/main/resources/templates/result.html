<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>診断結果</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1>診断結果</h1>

    <div class="score-box">
        <p>美容スコア</p>
        <strong th:text="${beautyScore}">85</strong>
        <span>点</span>
    </div>

    <h2 th:text="${resultTitle}">タイプ名</h2>

    <img th:src="@{${productImage}}" alt="診断タイプ画像" class="product-image">

    <p th:text="${resultText}">診断結果</p>

    <div class="recommend">
        <h3>おすすめアイテム</h3>
        <p th:text="${recommendedItem}">おすすめアイテム</p>
    </div>

    <div class="advice">
        <h3>ケアアドバイス</h3>
        <p th:text="${careAdvice}">ケアアドバイス</p>
    </div>

    <div class="brand-box">
        <h3>あなたに合った美容ブランド</h3>

        <ul class="brand-list">
            <li th:text="${brand1}">ブランド1</li>
            <li th:text="${brand2}">ブランド2</li>
            <li th:text="${brand3}">ブランド3</li>
        </ul>

        <p th:text="${brandReason}">おすすめ理由</p>
    </div>

    <a href="/diagnosis">もう一度診断する</a>
</div>

</body>
</html>
