<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>美容診断アプリ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1>美容診断アプリ</h1>
    <p>あなたに合った美容タイプを診断します。</p>

    <form action="/diagnosis/result" method="post">

        <label>肌質を選んでください</label>
        <select name="skinType">
            <option value="dry">乾燥肌</option>
            <option value="oily">脂性肌</option>
            <option value="sensitive">敏感肌</option>
            <option value="normal">普通肌</option>
        </select>

        <label>肌の悩みを選んでください</label>
        <select name="concern">
            <option value="acne">ニキビ</option>
            <option value="pores">毛穴</option>
            <option value="dullness">くすみ</option>
            <option value="none">特になし</option>
        </select>

        <label>好きなメイクスタイルを選んでください</label>
        <select name="makeupStyle">
            <option value="natural">ナチュラル</option>
            <option value="cute">かわいい系</option>
            <option value="cool">クール系</option>
        </select>

        <button type="submit">診断する</button>
    </form>
</div>

</body>
</html>
